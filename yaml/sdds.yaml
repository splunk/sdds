---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: splunk
  name: splunksdds
  labels:
    app: splunk
    role: splunksdds
    tier: sdds
spec:
  replicas: 3
  selector:
    matchLabels:
      app: splunk
      role: splunksdds
      tier: sdds
  template:
    metadata:
      labels:
        app: splunk
        role: splunksdds
        tier: sdds 
    spec:
      volumes:
        - name: sdds-global-config
          hostPath:
             path: /opt/sdds/global-config
        - name: sdds-deployment-apps
          hostPath:
             path: /opt/sdds/deployment-apps
      hostname: sdds
      dnsPolicy: ClusterFirst
      dnsConfig:
        searches:
          - sdds.splunk.svc.cluster.local
      containers:
        - name: splunksdds
          image: splunk/splunk:latest
          ports:
           - containerPort: 8089
             name: splunk
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "sudo sleep 60s; sudo /opt/splunk/bin/./splunk enable deploy-server -auth admin:splunk/splunk"]
          volumeMounts:
           - mountPath: /opt/splunk/etc/deployment-apps
             name: sdds-deployment-apps
           - mountPath: /opt/splunk/etc/apps/sdds_global_config
             name: sdds-global-config
          env:
            - name: SPLUNK_HOME
              value: /opt/splunk
            - name: SPLUNK_ETC
              value: /opt/splunk/etc
            - name: SPLUNK_PASSWORD
              value: splunk/splunk
              name: SPLUNK_GENERAL_TERMS
              value: --accept-sgt-current-at-splunk-com
            - name: SPLUNK_START_ARGS
              value: "--accept-license --no-prompt --answer-yes"
